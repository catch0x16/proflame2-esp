esphome:
  name: proflame2-fireplace

esp32:
  board: denky32
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ./components
    components: [proflame2]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ProFlame2-Fallback"
    password: !secret ap_password

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

spi:
  clk_pin: GPIO18
  miso_pin: GPIO19
  mosi_pin: GPIO23

# The CC1101 is driven by ESPHome's built-in cc1101 component. It runs in
# asynchronous serial mode: GDO0 is the TX data input, keyed directly by
# remote_transmitter's RMT output, which plays the ProFlame 2 burst as precise
# mark/space timings. gdo0_pin lets cc1101 flip the shared pin to an input
# whenever the radio returns to RX, so the two never drive it at once.
cc1101:
  id: cc1101_radio
  cs_pin: GPIO27
  gdo0_pin:
    number: GPIO25
    allow_other_uses: true
  # FCC filing / smartfire reference. The real remote measured ~315.07 MHz on an
  # rtl_433 dongle; OOK receivers are wide, so either works.
  frequency: 314.973MHz
  # RX only: the default 203kHz filter passes just +-101kHz around `frequency`, which
  # leaves a remote at ~315.07MHz on the filter edge (fragmented, undecodable RX).
  filter_bandwidth: 325kHz
  modulation_type: ASK/OOK
  output_power: 10

remote_transmitter:
  id: rf_tx
  pin:
    number: GPIO25
    allow_other_uses: true
  carrier_duty_percent: 100%  # OOK: no IR-style carrier, the CC1101 supplies the RF
  non_blocking: true
  on_transmit:
    then:
      - cc1101.begin_tx: cc1101_radio
  on_complete:
    then:
      - cc1101.begin_rx: cc1101_radio

# Only needed for the proflame2 `receive:` block (remote proxy). In RX the CC1101
# outputs demodulated OOK on the same GDO0 pin. idle splits the remote's burst into
# single packets (packets are ~5ms apart); filter drops the demodulator's noise spikes.
remote_receiver:
  id: rf_rx
  pin:
    number: GPIO25
    allow_other_uses: true
  idle: 2ms
  filter: 100us
  tolerance: 40%

proflame2:
  id: my_fireplace
  transmitter_id: rf_tx
  # Serial number cloned from your remote (24 bits). Capture it with rtl_433:
  #   rtl_433 -f 315M -R 207 -F json
  serial_number: 0xAA9402
  # Error-detection constants are DEVICE SPECIFIC - the fireplace ignores every
  # command if these don't match your remote. Derive them from a single rtl_433
  # capture of your remote (see README "Checksum Constants"). These values are
  # for remote 0xAA9402.
  checksum_c1: 0xF
  checksum_d1: 0xE
  checksum_c2: 0xE
  checksum_d2: 0x2

  # Remote proxy: accept commands from another ProFlame 2 remote and re-send them
  # with the serial number and checksum constants above. Capture this remote's
  # values the same way as your own (docs/CAPTURE.md). The serial must differ
  # from serial_number above.
  receive:
    receiver_id: rf_rx
    serial_number: 0x2FD302   # external remote, from tools/pf2_monitor.py
    checksum_c1: 0xF
    checksum_d1: 0xF
    checksum_c2: 0x4
    checksum_d2: 0x1

  power:
    name: "Fireplace Power"
    icon: "mdi:fireplace"

  pilot:
    name: "Fireplace Pilot Mode"
    icon: "mdi:fire"
    entity_category: diagnostic

  aux:
    name: "Fireplace Aux Power"
    icon: "mdi:power-plug"

  flame:
    name: "Fireplace Flame Height"
    icon: "mdi:fire"

  fan:
    name: "Fireplace Fan Speed"
    icon: "mdi:fan"

  light:
    name: "Fireplace Light Level"
    icon: "mdi:lightbulb"

  front:
    name: "Fireplace Front Flame"
    icon: "mdi:fire"

  thermostat:
    name: "Fireplace Thermostat Mode"
    icon: "mdi:thermostat"

  # Home Assistant can't change the settings above - the remote owns them. It can
  # only force the power off: while the override is on, every frame is sent with
  # power off. It releases itself when the remote next sends power off.
  override:
    name: "Fireplace Power Override"
    icon: "mdi:fireplace-off"

  # Engages the override (sends power off). For automations, e.g. "at midnight,
  # if Fireplace Power is on, press Fireplace Force Off".
  force_off:
    name: "Fireplace Force Off"
    icon: "mdi:fireplace-off"

sensor:
  - platform: wifi_signal
    name: "Fireplace WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Fireplace Uptime"

binary_sensor:
  - platform: status
    name: "Fireplace Connection Status"

button:
  - platform: restart
    name: "Fireplace Controller Restart"
    icon: "mdi:restart"

text_sensor:
  - platform: version
    name: "Fireplace ESPHome Version"
  - platform: wifi_info
    ip_address:
      name: "Fireplace IP Address"
    ssid:
      name: "Fireplace Connected SSID"

web_server:
  port: 80
  auth:
    username: admin
    password: !secret web_password

time:
  - platform: homeassistant
    id: homeassistant_time


