esphome:
  name: proflame2-fireplace

esp32:
  board: denky32
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ./components
    components: [proflame2]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ProFlame2-Fallback"
    password: !secret ap_password

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

spi:
  clk_pin: GPIO18
  miso_pin: GPIO19
  mosi_pin: GPIO23

# The CC1101 is driven by ESPHome's built-in cc1101 component. It runs in
# asynchronous serial mode: GDO0 is the TX data input, keyed directly by
# remote_transmitter's RMT output, which plays the ProFlame 2 burst as precise
# mark/space timings. gdo0_pin lets cc1101 flip the shared pin to an input
# whenever the radio returns to RX, so the two never drive it at once.
cc1101:
  id: cc1101_radio
  cs_pin: GPIO27
  gdo0_pin:
    number: GPIO25
    allow_other_uses: true
  # FCC filing / smartfire reference. The real remote measured ~315.07 MHz on an
  # rtl_433 dongle; OOK receivers are wide, so either works.
  frequency: 314.973MHz
  modulation_type: ASK/OOK
  output_power: 10

remote_transmitter:
  id: rf_tx
  pin:
    number: GPIO25
    allow_other_uses: true
  carrier_duty_percent: 100%  # OOK: no IR-style carrier, the CC1101 supplies the RF
  non_blocking: true
  on_transmit:
    then:
      - cc1101.begin_tx: cc1101_radio
  on_complete:
    then:
      - cc1101.begin_rx: cc1101_radio

proflame2:
  id: my_fireplace
  transmitter_id: rf_tx
  # Serial number cloned from your remote (24 bits). Capture it with rtl_433:
  #   rtl_433 -f 315M -R 207 -F json
  serial_number: 0xAA9402
  # Error-detection constants are DEVICE SPECIFIC - the fireplace ignores every
  # command if these don't match your remote. Derive them from a single rtl_433
  # capture of your remote (see README "Checksum Constants"). These values are
  # for remote 0xAA9402.
  checksum_c1: 0xF
  checksum_d1: 0xE
  checksum_c2: 0xE
  checksum_d2: 0x2

  power:
    name: "Fireplace Power"
    icon: "mdi:fireplace"

  pilot:
    name: "Fireplace Pilot Mode"
    icon: "mdi:fire"
    entity_category: config

  aux:
    name: "Fireplace Aux Power"
    icon: "mdi:power-plug"

  flame:
    name: "Fireplace Flame Height"
    icon: "mdi:fire"
    mode: slider

  fan:
    name: "Fireplace Fan Speed"
    icon: "mdi:fan"
    mode: slider

  light:
    name: "Fireplace Light Level"
    icon: "mdi:lightbulb"
    mode: slider

  front:
    name: "Fireplace Front Flame"
    icon: "mdi:fire"

  thermostat:
    name: "Fireplace Thermostat Mode"
    icon: "mdi:thermostat"

sensor:
  - platform: wifi_signal
    name: "Fireplace WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Fireplace Uptime"

binary_sensor:
  - platform: status
    name: "Fireplace Connection Status"

button:
  - platform: restart
    name: "Fireplace Controller Restart"
    icon: "mdi:restart"

text_sensor:
  - platform: version
    name: "Fireplace ESPHome Version"
  - platform: wifi_info
    ip_address:
      name: "Fireplace IP Address"
    ssid:
      name: "Fireplace Connected SSID"

web_server:
  port: 80
  auth:
    username: admin
    password: !secret web_password

time:
  - platform: homeassistant
    id: homeassistant_time


