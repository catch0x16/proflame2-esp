esphome:
  name: proflame2-test
  on_boot:
    priority: -100
    then:
      - logger.log: "ProFlame2 Debug System Started"
      - delay: 2s
      - lambda: |-
          auto* fireplace = id(my_fireplace);
          fireplace->debug_check_config();

esp32:
  board: denky32
  framework:
    type: arduino

external_components:
  - source:
      type: local
      path: ./components
    components: [proflame2]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ProFlame2-Debug"
    password: !secret ap_password

# VERBOSE logging for debugging
logger:
  level: VERBOSE
  logs:
    proflame2: VERBOSE  # Maximum logging

api:
  encryption:
    key: !secret api_encryption_key

spi:
  clk_pin: GPIO18
  miso_pin: GPIO19
  mosi_pin: GPIO23

proflame2:
  id: my_fireplace
  cs_pin: GPIO27
  gdo0_pin: GPIO25
  serial_number: 0xAA9402  # Your serial number
  frequency: 314.973MHz
  # Error-detection constants for THIS remote (0xAA9402), derived from and verified
  # against all 15 distinct command frames in the SDR captures.
  checksum_c1: 0xF
  checksum_d1: 0xE
  checksum_c2: 0xE
  checksum_d2: 0x2

  power:
    name: "Fireplace Power"
    icon: "mdi:fireplace"

  pilot:
    name: "Fireplace Pilot Mode"
    icon: "mdi:fire"
    entity_category: config

  aux:
    name: "Fireplace Aux Power"
    icon: "mdi:power-plug"

  flame:
    name: "Fireplace Flame Height"
    icon: "mdi:fire"
    mode: slider

  fan:
    name: "Fireplace Fan Speed"
    icon: "mdi:fan"
    mode: slider

  light:
    name: "Fireplace Light Level"
    icon: "mdi:lightbulb"
    mode: slider

  front:
    name: "Fireplace Front Flame"
    icon: "mdi:fire"

  thermostat:
    name: "Fireplace Thermostat Mode"
    icon: "mdi:thermostat"

sensor:
  - platform: wifi_signal
    name: "Fireplace WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Fireplace Uptime"

binary_sensor:
  - platform: status
    name: "Fireplace Connection Status"

button:
  - platform: restart
    name: "Fireplace Controller Restart"
    icon: "mdi:restart"
  
  # DEBUG BUTTONS
  - platform: template
    name: "DEBUG: Check CC1101 Config"
    icon: "mdi:chip"
    on_press:
      - lambda: |-
          auto* fireplace = id(my_fireplace);
          fireplace->debug_check_config();

          
  - platform: template
    name: "DEBUG: Verify CC1101 Hardware"
    icon: "mdi:chip"
    on_press:
      - lambda: |-
          auto* fireplace = id(my_fireplace);
          ESP_LOGI("hw", "=== CC1101 HARDWARE CHECK ===");
          
          // Read chip info
          uint8_t partnum = fireplace->read_status_register(0x30);
          uint8_t version = fireplace->read_status_register(0x31);
          
          ESP_LOGI("hw", "Part Number: 0x%02X (should be 0x00)", partnum);
          ESP_LOGI("hw", "Version: 0x%02X (should be 0x14 or 0x04)", version);
          
          if (partnum != 0x00) {
            ESP_LOGE("hw", "WRONG CHIP! This is not a CC1101!");
          }
          
          // Test register read/write (restore CHANNR=0 afterwards - leaving 0xA5
          // here would detune the radio by ~20 MHz!)
          fireplace->write_register(0x0A, 0xA5); // CHANNR test value
          uint8_t readback = fireplace->read_register(0x0A);
          ESP_LOGI("hw", "Register test: wrote 0xA5, read 0x%02X %s", readback,
                   readback == 0xA5 ? "(OK)" : "(FAIL - check SPI wiring)");
          fireplace->write_register(0x0A, 0x00); // restore

          // Check GDO0 pin voltage (if connected)
          fireplace->write_register(0x02, 0x29); // Set GDO0 to output high
          delay(10);
          ESP_LOGI("hw", "Set GDO0 high - measure ~3.3V on GDO0 pin");

          fireplace->write_register(0x02, 0x2E); // Set GDO0 to output low
          delay(10);
          ESP_LOGI("hw", "Set GDO0 low - measure ~0V on GDO0 pin");
          fireplace->write_register(0x02, 0x02); // restore TX FIFO threshold function

  - platform: template
    name: "DEBUG: Minimal TX Test"
    icon: "mdi:radio-tower"
    on_press:
      - lambda: |-
          id(my_fireplace)->debug_minimal_tx();


text_sensor:
  - platform: version
    name: "Fireplace ESPHome Version"
  - platform: wifi_info
    ip_address:
      name: "Fireplace IP Address"
    ssid:
      name: "Fireplace Connected SSID"

web_server:
  port: 80
  auth:
    username: admin
    password: !secret web_password

time:
  - platform: homeassistant
    id: homeassistant_time
