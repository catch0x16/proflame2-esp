esphome:
  name: proflame2-test
  on_boot:
    priority: -100
    then:
      - logger.log: "ProFlame2 Debug System Started"

esp32:
  board: denky32
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ./components
    components: [proflame2]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ProFlame2-Debug"
    password: !secret ap_password

# VERBOSE logging for debugging
logger:
  level: VERBOSE
  logs:
    proflame2: VERBOSE  # Maximum logging

api:
  encryption:
    key: !secret api_encryption_key

spi:
  clk_pin: GPIO18
  miso_pin: GPIO19
  mosi_pin: GPIO23

# The CC1101 is driven by ESPHome's built-in cc1101 component. It runs in
# asynchronous serial mode: GDO0 is the TX data input, keyed directly by
# remote_transmitter's RMT output, which plays the ProFlame 2 burst as precise
# mark/space timings. gdo0_pin lets cc1101 flip the shared pin to an input
# whenever the radio returns to RX, so the two never drive it at once.
cc1101:
  id: cc1101_radio
  cs_pin: GPIO27
  gdo0_pin:
    number: GPIO25
    allow_other_uses: true
  # FCC filing / smartfire reference. The real remote measured ~315.07 MHz on an
  # rtl_433 dongle; OOK receivers are wide, so either works.
  frequency: 314.973MHz
  modulation_type: ASK/OOK
  output_power: 10

remote_transmitter:
  id: rf_tx
  pin:
    number: GPIO25
    allow_other_uses: true
  carrier_duty_percent: 100%  # OOK: no IR-style carrier, the CC1101 supplies the RF
  non_blocking: true
  on_transmit:
    then:
      - cc1101.begin_tx: cc1101_radio
  on_complete:
    then:
      - cc1101.begin_rx: cc1101_radio

proflame2:
  id: my_fireplace
  transmitter_id: rf_tx
  serial_number: 0xAA9402  # Your serial number
  # Error-detection constants for THIS remote (0xAA9402), derived from and verified
  # against all 15 distinct command frames in the SDR captures.
  checksum_c1: 0xF
  checksum_d1: 0xE
  checksum_c2: 0xE
  checksum_d2: 0x2

  power:
    name: "Fireplace Power"
    icon: "mdi:fireplace"

  pilot:
    name: "Fireplace Pilot Mode"
    icon: "mdi:fire"
    entity_category: diagnostic

  aux:
    name: "Fireplace Aux Power"
    icon: "mdi:power-plug"

  flame:
    name: "Fireplace Flame Height"
    icon: "mdi:fire"

  fan:
    name: "Fireplace Fan Speed"
    icon: "mdi:fan"

  light:
    name: "Fireplace Light Level"
    icon: "mdi:lightbulb"

  front:
    name: "Fireplace Front Flame"
    icon: "mdi:fire"

  thermostat:
    name: "Fireplace Thermostat Mode"
    icon: "mdi:thermostat"

  # Home Assistant can't change the settings above - the remote owns them. It can
  # only force the power off: while the override is on, every frame is sent with
  # power off. It releases itself when the remote next sends power off.
  override:
    name: "Fireplace Power Override"
    icon: "mdi:fireplace-off"

  # Engages the override (sends power off). For automations, e.g. "at midnight,
  # if Fireplace Power is on, press Fireplace Force Off".
  force_off:
    name: "Fireplace Force Off"
    icon: "mdi:fireplace-off"

sensor:
  - platform: wifi_signal
    name: "Fireplace WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Fireplace Uptime"

binary_sensor:
  - platform: status
    name: "Fireplace Connection Status"

button:
  - platform: restart
    name: "Fireplace Controller Restart"
    icon: "mdi:restart"
  
  # DEBUG BUTTONS
  # CC1101 hardware/SPI health is checked by the cc1101 component at boot: its
  # config dump shows "Chip ID" and it marks itself failed if the chip doesn't answer.

  # 500ms of unmodulated carrier - an unmistakable stripe on an SDR waterfall at
  # the configured frequency. Proves the GDO0 -> CC1101 TX path end to end.
  - platform: template
    name: "DEBUG: 500ms Carrier"
    icon: "mdi:radio-tower"
    on_press:
      - remote_transmitter.transmit_raw:
          transmitter_id: rf_tx
          code: [500000]

  # Transmits the exact state captured from the real remote on Dec 29
  # (thermostat on, power off, fan 2, flame 6). rtl_433 -f 315M -R 207 must
  # decode our transmission EXACTLY like the remote's:
  #   id: aa9402  cmd1: 02  cmd2: 26  err1: bc  err2: 46  mic: CHECKSUM
  - platform: template
    name: "DEBUG: Replay Captured Frame"
    icon: "mdi:radio-tower"
    on_press:
      - lambda: |-
          // One frame with the whole state. Setting entities one by one would
          // first send a burst with only the first change applied.
          id(my_fireplace)->set_state(esphome::proflame2::ProFlame2Command{
              .pilot_cpi = false, .light_level = 0, .thermostat = true, .power = false,
              .front_flame = false, .fan_level = 2, .aux_power = false, .flame_level = 6});
          ESP_LOGI("replay", "Expect rtl_433: id=aa9402 cmd1=02 cmd2=26 err1=bc err2=46");


text_sensor:
  - platform: version
    name: "Fireplace ESPHome Version"
  - platform: wifi_info
    ip_address:
      name: "Fireplace IP Address"
    ssid:
      name: "Fireplace Connected SSID"

web_server:
  port: 80
  auth:
    username: admin
    password: !secret web_password

time:
  - platform: homeassistant
    id: homeassistant_time
